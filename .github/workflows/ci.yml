name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs_version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.4"
          - "30.2"

    steps:
      - uses: actions/checkout@v5

      - name: Run Tests via ELPAish
        run: |
          emacs --batch \
            -L . \
            --eval '(progn
              (require (quote package))
              (setq package-archives (quote (("gnu" . "https://elpa.gnu.org/packages/")
                                             ("melpa" . "https://melpa.org/packages/")
                                             ("elpaish" . "https://tychoish.github.io/elpaish/snapshot/"))))
              (setq package-unsigned-archives (quote ("elpaish")))
              (package-initialize)
              (unless package-archive-contents (package-refresh-contents))
              (unless (package-installed-p (quote elpaish))
                (package-install (quote elpaish)))
              (require (quote elpaish-check))
              (elpaish-test-package-batch))'
